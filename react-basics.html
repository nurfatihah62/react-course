<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>  <!-- Babel is a transpiler that converts JSX into JavaScript -->
    <script type="text/babel">
      const button =  <button>Click Me</button>; //JSX - html that were wrote in javascript
      const paragraph = <p>This is a paragraph</p>;
      const div = <div>
          {button}
          {paragraph}
        </div>; //JSX - html that were wrote in javascript


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div);
    </script>
  </body>
</html>
